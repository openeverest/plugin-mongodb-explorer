# Triggered when a tag of the form vX.Y.Z is pushed.
# Builds the frontend bundle, compiles the Go backend into a multi-arch
# Docker image (linux/amd64 + linux/arm64), pushes to GHCR, updates the
# Helm chart versions, packages the chart, and creates a GitHub release.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # openeverest/plugin-mongodb-explorer

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Build frontend bundle
  # ──────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build frontend bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build    # outputs dist/main.js

      - name: Upload bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-bundle
          path: dist/main.js
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Build & push multi-arch Docker image
  # ──────────────────────────────────────────────────────────────────────────
  build-image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: build-frontend
    permissions:
      contents: read
      packages: write

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download frontend bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-bundle
          path: dist/

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        run: cd backend && go mod download

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Package Helm chart and create GitHub release
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Package chart & create release
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "3.14.0"

      - name: Extract version from tag
        id: version
        # Strip the leading "v" to get a SemVer string for Chart.yaml.
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Bump Chart.yaml version and appVersion
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHART="charts/plugin-mongodb-explorer/Chart.yaml"
          sed -i "s/^version:.*/version: ${VERSION}/" "$CHART"
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" "$CHART"
          cat "$CHART"

      - name: Bump image tag in values.yaml
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/^  tag:.*/  tag: \"${VERSION}\"/" \
            charts/plugin-mongodb-explorer/values.yaml

      - name: Package Helm chart
        run: |
          mkdir -p release-artifacts
          helm package charts/plugin-mongodb-explorer/ \
            --destination release-artifacts/

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          DIGEST="${{ needs.build-image.outputs.image-digest }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          cat > release-artifacts/notes.md <<EOF
          ## MongoDB Explorer Plugin v${VERSION}

          ### Docker image

          \`\`\`
          ${IMAGE}:${VERSION}
          \`\`\`

          Image digest: \`${DIGEST}\`

          Platforms: \`linux/amd64\`, \`linux/arm64\`

          ### Install with Helm

          \`\`\`bash
          helm install mongo-explorer oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/plugin-mongodb-explorer \\
            --version ${VERSION} \\
            -n everest-system
          \`\`\`

          Or from the release tarball:

          \`\`\`bash
          helm install mongo-explorer plugin-mongodb-explorer-${VERSION}.tgz -n everest-system
          \`\`\`
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body_path: release-artifacts/notes.md
          files: |
            release-artifacts/plugin-mongodb-explorer-*.tgz
          fail_on_unmatched_files: true

      - name: Push Helm chart to GHCR OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login \
            ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin
          helm push release-artifacts/plugin-mongodb-explorer-*.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
